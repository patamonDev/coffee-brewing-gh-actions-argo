name: Build OCI

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      -
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -
      #   name: Build and Export to Docker
      #   uses: docker/build-push-action@v7
      #   with:
      #     load: true
      #     tags: patamondev/coffee-webapp:latest

      # -
      #   name: Test Docker OCI
      #   run: |
      #     docker run --rm docker push patamondev/coffee-webapp:latest

      -
        name: Build and Push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: patamondev/coffee-webapp:${{ github.sha }}

  update-manifests:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: patamonDev/argo-coffee
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}

      - name: Set new image tag
        run: |
          cd base
          kustomize edit set image patamondev/coffee-webapp=patamondev/coffee-webapp:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${{ github.sha }}"
          git push